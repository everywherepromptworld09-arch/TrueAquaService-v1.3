name: Build TRUE AQUA SERVICE V1.3 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q classes.dex
          unzip -l "$APK" | grep -q assets/index.html
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.maksolutions.trueaqua'" apk-badging.txt
          grep -q "versionName='1.3'" apk-badging.txt
          ls -lh "$APK"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator install and launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            APK=app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb shell am start -W -n com.maksolutions.trueaqua/.MainActivity
            sleep 5
            adb shell pidof com.maksolutions.trueaqua
            adb shell dumpsys package com.maksolutions.trueaqua | grep versionName
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrueAquaService-v1.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
